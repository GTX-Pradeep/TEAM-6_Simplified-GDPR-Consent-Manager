name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Server - typecheck and unit tests
        run: |
          npm run typecheck -w server
          npm run test:coverage -w server

      - name: Client - unit tests
        run: npm test -w client

      - name: Build server and client
        run: npm run build
