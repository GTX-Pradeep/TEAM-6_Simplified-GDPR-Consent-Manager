services:
  db:
    image: postgres:16-alpine
    container_name: gdpr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdpr
      POSTGRES_PASSWORD: gdpr_dev_password
      POSTGRES_DB: gdpr_consent
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - gdpr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdpr -d gdpr_consent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gdpr_db_data:
